name: Update uptime

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculate uptime and patch README
        run: |
          START=$(date -d "2024-08-19" +%s)
          NOW=$(date +%s)
          DAYS=$(( (NOW - START) / 86400 ))
          sed -i "s|<!--UPTIME:START-->.*<!--UPTIME:END-->|<!--UPTIME:START-->${DAYS} days (since 19.08.2024)<!--UPTIME:END-->|" README.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add README.md && git commit -m "chore: update uptime" && git push)
